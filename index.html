<!doctype html>
<html lang="fr" class="bg-stone-950 text-white">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>CycloCoach - Entraîneur Cycliste Vocal & GPS</title>
    <meta name="description" content="Application de coaching cycliste vocal en direct et suivi GPS par intervalles." />
    
    <!-- PWA & Mobile Web App Settings -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0c0a09" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CycloCoach" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  </head>
  <body class="bg-stone-950 text-white antialiased selection:bg-amber-500 selection:text-stone-950">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol === 'https:') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => {
            console.log('SW registration skipped:', err);
          });
        });
      }
    </script>
  </body>
</html>
